<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping list</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
   <main>
    <section id="shopping-form">
    <h2>Add an Item</h2>

    <form id="item-form">
        <label for ="item-name">Item name:</label>
        <input
            type="text"
            id="item-name"
            placeholder="e.g. Milk"
            required
        >


       <label for="item-price">Price:</label>
                <input
                    type="number"
                    id="item-price"
                    placeholder="e.g. 150"
                    min="0.01"
                    step="0.01"
                    required
                >

                <button type="submit">Add Item</button>
            </form>
        </section>

        <section id="shopping-list-section">
            <h2>Shopping List</h2>

            <ul id="shopping-list">

            </ul>

            <p>
                Total cost of purchased items:
                KSh <span id="total-cost">0.00</span>
            </p>

            <button type="button" id="clear-list">Clear List</button>
        </section>
   </main>
    
</body>
</html>
